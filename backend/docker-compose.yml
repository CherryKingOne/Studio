services:
  mysql:
    image: mysql:8.0
    container_name: novelcast-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-novelcast}
      MYSQL_USER: ${MYSQL_USER:-novelcast}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-novelcast}
      TZ: UTC
    ports:
      - "13306:3306"
    volumes:
      - novelcast_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -unovelcast -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:latest
    container_name: novelcast-rustfs
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_VOLUMES: /data
      TZ: UTC
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - novelcast_rustfs_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novelcast-api
    command: ["novelcast-server"]
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      DATABASE_URL: mysql://novelcast:${MYSQL_PASSWORD:-novelcast}@mysql:3306/novelcast
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret-0123456789abcdef}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-novelcast}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      LOG_LEVEL: info
      LOG_FORMAT: json
      TZ: UTC
    ports:
      - "18080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novelcast-worker
    command: ["novelcast-worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: mysql://novelcast:${MYSQL_PASSWORD:-novelcast}@mysql:3306/novelcast
      JWT_SECRET: ${JWT_SECRET:-change-me-production-secret-0123456789abcdef}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_REGION: us-east-1
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-novelcast}
      LOG_LEVEL: info
      LOG_FORMAT: json
      TZ: UTC
    depends_on:
      mysql:
        condition: service_healthy
      rustfs:
        condition: service_started
    restart: unless-stopped

volumes:
  novelcast_mysql_data:
  novelcast_rustfs_data:
