[package]
name = "novelcast-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[lib]
name = "novelcast"
path = "src/lib.rs"

[[bin]]
name = "novelcast-server"
path = "src/main.rs"

[[bin]]
name = "novelcast-worker"
path = "src/bin/worker.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
async-trait = "0.1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["macros", "multipart"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
encoding_rs = "0.8"
futures-util = "0.3"
hex = "0.4"
jsonwebtoken = "9"
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }
zip = "2"
